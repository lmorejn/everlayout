name: Compilar Skoxa's

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Skoxas-windows
          path: desktop/dist/*.exe
          retention-days: 30
      # Cada versión (la de desktop/package.json) tiene su propia entrada en Releases con sus instaladores.
      # Mientras no se cambie el número de versión, cada compilación reemplaza los instaladores de esa entrada.
      - name: Versión y notas
        id: v
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          node -e "
            const fs=require('fs'); const t=fs.readFileSync('../CHANGELOG.md','utf8');
            const parts=t.split(/^## /m).slice(1);
            const pick=parts.filter(p=>p.startsWith('Sin publicar')||p.startsWith('$VER'));
            const body=pick.map(p=>'### '+p.trim()).join('\n\n')||'Ver CHANGELOG.md';
            fs.writeFileSync('notas.md', body+'\n\n---\n- **Skoxas-$VER-win-x64.exe**: instalador.\n- **Skoxas-$VER-portable.exe**: se ejecuta sin instalar.\n\nLos binarios no están firmados: la primera vez Windows pedirá confirmación (Más información › Ejecutar de todas formas).\n\nCompilado desde ${GITHUB_SHA::7}.');
          "
      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Skoxa's ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: desktop/notas.md
          make_latest: true
          files: desktop/dist/*.exe
